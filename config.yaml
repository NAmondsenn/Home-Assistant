assistant:
  name: "Nova"
  wake_word: "Hey Nova"

llm:
  provider: "claude"
  model: "claude-haiku-4-5-20251001"
  max_tokens: 150
  temperature: 0.7
  # Seconds to wait for a reply before giving up, and how many times to retry.
  # Searches do more work, so they get longer.
  timeout: 15
  search_timeout: 45
  max_retries: 1

audio:
  sample_rate: 48000
  channels: 1
  chunk_size: 2048
  # Seconds of audio from just before the wake word was detected which are kept,
  # so "Hey Nova what time is it", said in one breath, isn't cut short.
  pre_roll: 0.3

spotify:
  device_name: "Voice-Assistant"
  pause_while_speaking: true

whisper:
  model: "base.en"
  device: "cpu"
  compute_type: "int8"
  fallback_model: "tiny.en"
  # Higher is more accurate and slower.
  beam_size: 5
  # Words the model is told to expect, which biases it towards the names this
  # assistant actually hears rather than similar sounding ones.
  initial_prompt: >-
    Hey Nova. Play Spotify. Pause the music, skip this track, shuffle,
    repeat, play my playlist. Set a timer, set a reminder, cancel the timer.
    Turn on the lights. What time is it? What's the weather?

conversation:
  history_length: 5
  # Seconds an exchange is remembered for, once a new conversation starts.
  history_max_age: 300

# Web search is only used when the query explicitly asks for it
# (e.g. "search for..."), so normal replies stay fast and free.
# Each search is billed by Anthropic on top of token costs.
web_search:
  enabled: true
  max_uses: 3

thresholds:
  # How long the user has to be quiet before the recording stops.
  silence_duration: 0.8
  # How sure the voice activity model has to be that it's hearing speech, from 0 to 1.
  # Raise it if background noise keeps recordings going; lower it if quiet speech is missed.
  vad_threshold: 0.5
  # Only used if the voice activity model can't be loaded: volume below which audio
  # counts as silence.
  silence_threshold: 0.05
  # How long to wait for the user to start talking after the wake word before canceling.
  speech_timeout: 3.0
  follow_up_timeout: 6.0
  max_follow_ups: 3
  # Hard cap on a single recording.
  recording_timeout: 10.0
  # Minimum confidence required to consider a wake word detected.
  wake_word_confidence: 0.5

timers:
  # Reminders are announced twice in quick succession.
  announcements: 2
  repeat_gap: 1.5
  # Reminders come back every 30 seconds for 5 minutes, then expire.
  reminder_round_gap: 30
  reminder_give_up_after: 300
  # Breather between rounds while a timer keeps ringing. Not a cap.
  timer_repeat_gap: 3
  # Duration the timer goes unanswered before setting max volume.
  timer_volume_boost_after: 120
  # How long a timer rings before giving up, so nothing rings indefinitely.
  # Measured in time, not rounds, since a round's length varies with the message.
  timer_give_up_after: 600
  # Alarms ring in cycles rather than continuously. This has a 2.5 minute sound phase, followed by 2.5 minutes of silence.
  # This repeats 3 time, lasting about 15 minutes in total.
  alarm_ring_duration: 150
  alarm_gap_duration: 150
  alarm_max_cycles: 3
  # Within each sound phase, the alarm plays in bursts with a short gap after each, so
  # "Hey Nova, stop" can be heard over it, and builds up from quiet to full volume.
  alarm_burst: 3
  alarm_burst_gap: 1
  alarm_ramp: 30

sounds:
  chime_enabled: true
  reminder_enabled: true
  # A short blip after the wake word (and before a follow-up answer) to say it's listening.
  listening_enabled: true
  volume_step: 10
