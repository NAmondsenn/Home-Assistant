assistant:
  name: "Nova"
  wake_word: "Hey Nova"

llm:
  provider: "claude"
  model: "claude-haiku-4-5-20251001"
  max_tokens: 150
  temperature: 0.7

audio:
  sample_rate: 48000
  channels: 1
  chunk_size: 2048

spotify:
  device_name: "Voice-Assistant"
  pause_while_speaking: true

whisper:
  model: "base.en"
  device: "cpu"
  compute_type: "int8"
  fallback_model: "tiny.en"
  # Higher is more accurate and slower.
  beam_size: 5
  # Words the model is told to expect, which biases it towards the names this
  # assistant actually hears rather than similar sounding ones.
  initial_prompt: >-
    Hey Nova. Play Spotify. Pause the music, skip this track, shuffle,
    repeat, play my playlist. Set a timer, set a reminder, cancel the timer.
    Turn on the lights. What time is it? What's the weather?

conversation:
  history_length: 5

# Web search is only used when the query explicitly asks for it
# (e.g. "search for..."), so normal replies stay fast and free.
# Each search is billed by Anthropic on top of token costs.
web_search:
  enabled: true
  max_uses: 3

thresholds:
  # How long the user has to be quiet before the recording stops.
  silence_duration: 0.8
  # Volume below which audio counts as silence.
  # Raise this if the assistant keeps listening for too long after you've stopped talking.
  silence_threshold: 0.05
  # How long to wait for the user to start talking after the wake word before
  # giving up, so a false trigger doesn't hold the assistant for the full timeout.
  speech_timeout: 3.0
  # Hard cap on a single recording, in case silence is never detected.
  recording_timeout: 10.0
  # Minimum confidence required to consider a wake word detected.
  wake_word_confidence: 0.5

sounds:
  chime_enabled: true
  reminder_enabled: true
  volume_step: 10
  spotify_max_volume: 100
