# Every setting, with its default. Don't change them here: put just the ones you want
# different in ~/.config/nova/config.yaml, in the same sections - e.g.
#
#   music:
#     player: "navidrome"
#
# That file is this install's own, outside the repository, so an update never touches
# it. It's checked against this one as Nova starts, so a misspelt setting is caught.
# Keys and passwords go in ~/.config/nova/.env. See voice_assistant/paths.py.

assistant:
  name: "Nova"
  wake_word: "Hey Nova"

llm:
  # Haiku 5.5 was as quick as 4.5 on Nova's own requests, and as accurate - see the
  # commit which switched to it.
  model: "claude-haiku-5-5"
  # The longest a reply may be, in tokens - about 0.75 of a word each. Claude's thinking
  # counts toward it, so these leave room to think and still say something: a long
  # think at 300 could use them all, and a search needs more.
  max_tokens: 1024
  max_tokens_search: 1200
  # How hard Claude thinks before it answers - low, medium, high, xhigh or max; the
  # lower, the quicker. Only low was trialled. With thinking off,
  # Haiku 5.5 wrote its working-out into the reply, which was then said aloud; in a
  # trial of 36 replies per setup, low leaked none for 0.4 s more than off.
  effort: "low"
  # Leave null: Haiku 5.5 refuses any request which sets a temperature. A number is only
  # for a model which takes one beside thinking.
  temperature: null
  # Seconds to wait for a reply before giving up, and how many times to retry.
  # Searches do more work, so they get longer.
  timeout: 15
  search_timeout: 45
  max_retries: 1

audio:
  sample_rate: 48000
  # Takes what Nova plays itself - music from Navidrome, its voice, timers - back out
  # of what the microphone hears, so "Hey Nova" can be heard over the music. Uses the
  # Pi's own speexdsp; without it, this does nothing. Spotify plays through another
  # program, so isn't taken out.
  echo_cancellation: true
  # Seconds of audio from just before the wake word was detected which are kept,
  # so "Hey Nova what time is it", said in one breath, isn't cut short. Set on the
  # satellite, which tells the brain how much it sent with each wake.
  pre_roll: 0.3

music:
  # What plays the music: "navidrome" - your own music server, set up below - or
  # "spotify", which needs Spotify Premium.
  player: "spotify"
  # Whether Nova offers to download a song or album Navidrome hasn't got, through
  # SoulSync, when you ask to play it. "Download X" works either way.
  offer_downloads: true
  # How long Nova waits for a download to appear in Navidrome before saying it couldn't
  # get it, counted from the request. Read at each check, so a change is used straight away.
  song_download_minutes: 10
  album_download_minutes: 30

navidrome:
  # Navidrome's address, e.g. "http://navidrome.local:4533", and the user Nova signs in
  # as. The password goes in ~/.config/nova/.env as NAVIDROME_PASSWORD.
  url: ""
  username: ""

soulsync:
  # SoulSync's address, e.g. "http://soulsync.local:8008", for music Nova downloads when
  # Navidrome hasn't got it. The key, made in SoulSync's own settings, goes in
  # ~/.config/nova/.env as SOULSYNC_API_KEY.
  url: ""

spotify:
  device_name: "Voice-Assistant"
  pause_while_speaking: true

backend:
  # On a satellite: Nova's brain, as "name:port" on the tailnet, e.g. "nova:10400" -
  # see docs/decisions/0006. The satellite needs the password the brain gave it from
  # add-satellite, as NOVA_BACKEND_TOKEN in ~/.config/nova/.env. There's no standalone
  # mode: without a brain it can only ring its timers and alarms, and say it can't
  # reach it.
  address: ""
  # This satellite's name, which the brain knows its password by - see add-satellite
  # in backend.py. Left empty, it's this machine's own name.
  satellite: ""
  # Only used on the backend itself: the port it listens on, on its own machine -
  # Tailscale passes the tailnet's connections on to it - and the streaming model it
  # hears with, inside the project.
  port: 10400
  model: "models/sherpa-onnx-nemotron-speech-streaming-en-0.6b-560ms-int8-2026-04-25"
  # A second, small offline model asked first when the streaming one hears nothing in
  # a short recording of you talking - a lone "Pause." - see voice_assistant/parakeet.py.
  # Empty switches it off, and Nova hears such words again by itself, more slowly.
  fallback_model: "models/sherpa-onnx-nemo-parakeet_tdt_transducer_110m-en-36000-int8"

ntfy:
  # Your own ntfy server, e.g. "https://ntfy.example.com" - for alerts said out loud
  # as they arrive, and things sent to your phone. See voice_assistant/ntfy.py. Its
  # access token goes in ~/.config/nova/.env as NTFY_TOKEN. Left empty, it isn't used.
  url: ""
  # Topics whose messages are said out loud as they arrive, e.g. ["homelab"].
  alerts: []
  # Where "send that to my phone" goes, where a reminder nobody answered goes, and
  # where Nova says it had to restart itself after a problem. Empty for none.
  phone: ""
  reminders: ""
  restarts: ""
  # Between these times only the most urgent alerts - ntfy's priority 5 - are said
  # out loud. The rest wait for "any notifications?".
  quiet_from: "23:00"
  quiet_until: "07:00"

settings_page:
  # The page for looking after Nova from a phone or a laptop - see
  # voice_assistant/settings_page.py. It listens on this machine alone, for Tailscale
  # to pass the tailnet's requests on to it over HTTPS:
  #   tailscale serve --bg --https=443 http://127.0.0.1:8765
  # 0 switches it off.
  port: 8765
  # The Tailscale logins let in, e.g. ["you@example.com"]. Nobody is until it's set.
  allow: []
  # A second port, on every address, for Nginx Proxy Manager to pass the page on from,
  # e.g. 8766 - behind the page's own password, set on the page at its Tailscale
  # address first. 0 switches it off. Used once Nova restarts.
  proxy_port: 0
  # The addresses answered on that port - NPM's alone. Nothing is until it's set.
  proxy_from: []

display:
  # The port the clock displays connect on, e.g. 8767, on every address, as a clock is on
  # the home Wi-Fi rather than the tailnet - each with a key made on the settings page,
  # under Clock displays. See docs/decisions/0013. 0 switches it off. Used once Nova restarts.
  port: 0

conversation:
  history_length: 5
  # Seconds an exchange is remembered for, once a new conversation starts.
  history_max_age: 300

# Web search is only used when the query explicitly asks for it
# (e.g. "search for..."), so normal replies stay fast and free.
# Each search is billed by Anthropic on top of token costs.
web_search:
  enabled: true
  max_uses: 3

voice:
  # How fast Nova speaks, from 0.75 to 1.5. 1.0 is the voice's own pace.
  speed: 1.0

thresholds:
  # How long the user has to be quiet before the recording stops. Every bit of this is
  # waited out before Nova can answer, but too short and a pause mid-sentence ends it -
  # raise it if Nova cuts you off.
  silence_duration: 0.6
  # How sure the voice activity model has to be that it's hearing speech, from 0 to 1.
  # Raise it if background noise keeps recordings going; lower it if quiet speech is missed.
  vad_threshold: 0.5
  # Only used if the voice activity model can't be loaded: volume below which audio
  # counts as silence.
  silence_threshold: 0.05
  # How long to wait for the user to start talking after the wake word before canceling.
  speech_timeout: 3.0
  follow_up_timeout: 6.0
  max_follow_ups: 3
  # The longest one request may last, in seconds, from the wake word to the end of what
  # you say. Each satellite is told it, but never records for more than 30 seconds
  # whatever it is set to.
  recording_timeout: 15.0
  # How sure Nova must be that it heard its wake word, from 0.3 to 0.95. Raise it if Nova
  # wakes when nobody said it; lower it if it misses you.
  wake_word_confidence: 0.5
  # The same while something's playing in the satellite's room - any media player Home
  # Assistant puts there, but not Nova's own music - as a film's speech can sound like the
  # wake word. The higher of the two is used then.
  media_wake_word_confidence: 0.75
  # How sure Nova must be that a wake word is in your voice, from 0.0 to 0.95, once a
  # check has been trained on it - see docs/decisions/0011-the-voice-check.md. A wake
  # word below it is ignored. Raise it if Nova still wakes for others; lower it if it
  # misses you. 0 is no check, as is having none trained.
  voice_check: 0.2

timers:
  # Reminders are announced twice in quick succession.
  announcements: 2
  repeat_gap: 1.5
  # Reminders come back every 30 seconds for 5 minutes, then expire.
  reminder_round_gap: 30
  reminder_give_up_after: 300
  # Breather between rounds while a timer keeps ringing. Not a cap.
  timer_repeat_gap: 3
  # Duration the timer goes unanswered before setting max volume.
  timer_volume_boost_after: 120
  # How long a timer rings before giving up, so nothing rings indefinitely.
  # Measured in time, not rounds, since a round's length varies with the message.
  timer_give_up_after: 600
  # Alarms ring in cycles rather than continuously. This has a 2.5 minute sound phase, followed by 2.5 minutes of silence.
  # This repeats 3 times, lasting about 15 minutes in total.
  alarm_ring_duration: 150
  alarm_gap_duration: 150
  alarm_max_cycles: 3
  # Within each sound phase, the alarm plays in bursts with a short gap after each, so
  # "Hey Nova, stop" can be heard over it, and builds up from quiet to full volume.
  alarm_burst: 3
  alarm_burst_gap: 1
  alarm_ramp: 30

sounds:
  chime_enabled: true
  # The sound before an alert or a battery warning. What the clock rings - a timer,
  # a reminder or an alarm - always has its sound, whatever this says.
  reminder_enabled: true
  # A short blip after the wake word (and before a follow-up answer) to say it's listening,
  # and the same blip backwards when it gave up without hearing anything.
  listening_enabled: true
  volume_step: 10

wake_clips:
  # Whether the satellite keeps 3 seconds of audio around each wake - 2 before the wake
  # word was heard and 1 after - so the voice check can learn from real false wakes.
  # They stay on the Pi, readable by you only, in
  # ~/.local/share/nova/voice-samples/wake/clips, and are never sent anywhere. Each is
  # named for the wake's time and score, like 20261031-120501-0.73.wav. A clip is dropped
  # if the microphone was muted around it, as far as the satellite has heard by then. The
  # log says when clips are being kept, and each one. Switch it on in the Pi's own
  # settings for as long as it's needed, then off again. Used once Nova restarts, so it
  # goes on keeping them until then.
  keep: false
  # At this many clips it stops keeping them and logs a warning. Nova never deletes any.
  most: 400

logging:
  # Whether what's said to the assistant, and its replies, are written to the logs
  # (backend.log on the brain, in ~/.local/share/nova/logs, and the system journal). Handy
  # while setting things up; turn it off to keep conversations out of the logs altogether.
  log_transcripts: true

home_assistant:
  # Home Assistant's address, e.g. "http://homeassistant.local:8123". Nova signs in
  # with a long-lived access token, as HA_TOKEN in ~/.config/nova/.env on the brain,
  # made by a Home Assistant user of its own who is an administrator - Home Assistant
  # only tells an administrator which room each device is in, which Nova's room and
  # Claude's lights need. An administrator's token can do anything in Home Assistant,
  # so it's Nova's own code which keeps it to the lights, finding and ringing your
  # phone, the PC's own buttons, reading how things are for Claude, and the scripts and
  # scenes run from the settings page or by Claude, and never anything which locks,
  # unlocks or opens. Assist, for the requests passed on in plain words, only reaches
  # the devices exposed to it. See the README.
  url: ""

batteries:
  # Nova finds every device Home Assistant has a battery level for, and warns you once as
  # each one falls to each of its marks. Warnings go to your phone through ntfy.phone
  # and, while you're home outside ntfy's quiet hours, are said out loud as well - see
  # docs/decisions/0007. Home Assistant is needed for this. These are the marks to start
  # with - exactly one for a phone or tablet and two for anything else, and the settings
  # page keeps to the same; each device's own are changed there.
  # Phones and tablets, which are warned about once, as a percentage.
  mobile_marks: [5]
  # Everything else - a laptop, a remote - warned about at each, highest first.
  other_marks: [15, 5]
  # How often, in seconds, the batteries are read.
  check_every: 60
  # How old a reading may be, in seconds, and still count as the level now. One older
  # is said with its age - "was on 88%, 3 days ago" - so it isn't taken for the level now.
  stale_after: 3600

mqtt:
  # Home Assistant's MQTT broker - the Mosquitto add-on - through which Nova is a
  # device of its own in Home Assistant, with its controls and its room there. See
  # voice_assistant/ha_device.py. The host is Home Assistant's own address on the
  # home network, e.g. "192.168.1.20", not its web address, which only passes on web
  # requests. Left empty, Nova isn't in Home Assistant, and works as it does without.
  host: ""
  port: 1883
  # A Home Assistant user of Nova's own, not an administrator. Its password goes in
  # ~/.config/nova/.env as MQTT_PASSWORD.
  username: ""
  # What Nova's device is called in Home Assistant. Its ids there come from this and
  # the machine's own name, so a second Nova is a second device. Changing it later
  # makes a new device, leaving the old one to be deleted in Home Assistant.
  name: "Nova"
