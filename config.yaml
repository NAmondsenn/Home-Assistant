assistant:
  name: "Nova"
  wake_word: "Hey Nova"

llm:
  provider: "claude"
  model: "claude-haiku-4-5-20251001"
  max_tokens: 80
  temperature: 0.7

audio:
  sample_rate: 48000
  channels: 1
  chunk_size: 2048

whisper:
  model: "base.en"
  device: "cpu"
  compute_type: "int8"
  fallback_model: "tiny.en"

conversation:
  history_length: 5

# Web search is only used when the query explicitly asks for it
# (e.g. "search for..."), so normal replies stay fast and free.
# Each search is billed by Anthropic on top of token costs.
web_search:
  enabled: true
  max_uses: 3

thresholds:
  silence_duration: 1.0
  recording_timeout: 8.0
  wake_word_confidence: 0.5
