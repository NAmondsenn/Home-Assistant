<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=800, user-scalable=no">
  <title>Nova</title>
  <link rel="stylesheet" href="display.css">
  <script src="display-gestures.js" defer></script>
  <script src="display.js" defer></script>
</head>
<body>
  <div id="background" class="background"></div>

  <main id="pages">
    <section id="home" class="page home">
      <div class="tile time-tile">
        <div id="date" class="label"></div>
        <div id="time" class="time">--:--</div>
      </div>
      <div class="tile weather-tile">
        <div class="label">Weather</div>
        <div id="weather" hidden>
          <div id="temperature" class="temperature"></div>
          <div id="condition" class="condition dim"></div>
          <div id="high-low" class="high-low dim"></div>
        </div>
        <div id="no-weather" class="no-weather dim">No weather</div>
      </div>
      <div class="tile next-tile">
        <div class="label">Next</div>
        <div id="next" hidden>
          <div id="next-what" class="next-what"></div>
          <div id="next-when" class="dim"></div>
        </div>
        <div id="no-next" class="tile-none dim">Nothing coming up</div>
      </div>
      <div class="tile later-tile">
        <div class="label">Later</div>
        <div id="later" class="later"></div>
        <div id="no-later" class="tile-none dim">Nothing coming up</div>
      </div>
    </section>

    <section id="coming-up" class="page" hidden>
      <h1>Coming up</h1>
      <ol id="events" class="events"></ol>
      <p id="no-events" class="dim" hidden>Nothing coming up.</p>
    </section>

    <section id="now-playing" class="page" hidden>
      <div id="playing-time" class="playing-time"></div>
      <div id="playing" class="playing" hidden>
        <div class="art"><img id="cover" alt="" hidden></div>
        <div class="track">
          <div id="source" class="source dim"></div>
          <div id="title" class="title"></div>
          <div id="artist" class="artist dim"></div>
          <div id="progress" class="progress"><div id="progress-done" class="progress-done"></div></div>
          <div id="times" class="times dim"></div>
        </div>
      </div>
      <p id="nothing-playing" class="nothing dim">Nothing's playing.</p>
    </section>
  </main>

  <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>

  <div id="marks" class="marks">
    <span id="offline" class="mark offline" hidden>Offline</span>
    <span id="muted" class="mark muted" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11a6 6 0 0 0 12 0M12 17v4M4 4l16 16"/></svg>
      Muted
    </span>
  </div>

  <div id="nova" class="nova" hidden>
    <div class="veil"></div>
    <div class="blob">
      <div class="aura"></div>
      <div class="aura aura-inner"></div>
      <div class="lobes">
        <div class="orbit o1"><div class="lobe"></div></div>
        <div class="orbit o2"><div class="lobe"></div></div>
        <div class="orbit o3"><div class="lobe"></div></div>
        <div class="orbit o4"><div class="lobe"></div></div>
        <div class="orbit o5"><div class="lobe"></div></div>
        <div class="core"></div>
      </div>
    </div>
    <div id="heard" class="heard"></div>
  </div>

  <div id="volume" class="volume" hidden>
    <span id="volume-what" class="volume-what"></span>
    <div class="volume-bar"><div id="volume-level" class="volume-level"></div></div>
    <span id="volume-percent" class="volume-percent"></span>
  </div>

  <div id="message" class="overlay message" hidden>
    <p id="message-text"></p>
    <p id="message-more" class="dim"></p>
  </div>
</body>
</html>
