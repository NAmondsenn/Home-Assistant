# Exact versions of every package the satellite needs, frozen from the venv on the Pi
# (Debian 13, Python 3.13) on 19 October 2026, once it was working there, and trimmed
# on 22 October 2026 to what satellite.py uses - the brain, on PVE2, has the rest (see
# requirements-backend.txt and docs/decisions/0006). requests stays because
# openWakeWord imports it, though the satellite makes no requests of its own.
# requirements.txt says what's needed; this says what's known to work.
#
# Install it without dependency resolution, since it already lists everything -
# resolving would pull in openwakeword's tflite-runtime, which has no wheels for
# Python 3.12+:
#
#   venv/bin/pip install --no-deps -r requirements.lock
#
# It's for Python 3.13 - on any other version use requirements.txt instead. After a
# tested upgrade, regenerate it with "venv/bin/pip freeze", leaving out pip, wheel and
# anything nothing needs. An existing venv can keep the packages this dropped, unused.
# scipy, scikit-learn, joblib, threadpoolctl, cloudpickle and narwhals are there because importing openwakeword
# at all imports its custom-verifier trainer, which needs them, though Nova never trains
# one. They were in the first lock (19 October) and dropped with librosa on 20 October,
# which left a fresh install from it unable to import openwakeword (the Pi's existing
# venv kept them, so it didn't show). Re-added at the versions pip chose on the Pi on
# 22 October 2026, checked by importing openwakeword in a fresh venv.
