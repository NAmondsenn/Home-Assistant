# Exact versions of every package Nova needs, frozen from the venv on the Pi
# (Debian 13, Python 3.13) on 19 October 2026, once it was working there.
# requirements.txt says what's needed; this says what's known to work.
#
# Install it without dependency resolution, since it already lists everything -
# resolving would pull in openwakeword's tflite-runtime, which has no wheels for
# Python 3.12+:
#
#   venv/bin/pip install --no-deps -r requirements.lock
#
# It's for Python 3.13 - on any other version use requirements.txt instead. After a
# tested upgrade, regenerate it with "venv/bin/pip freeze", leaving out pip, wheel and
# anything nothing needs. librosa and PyAudio, and the 17 packages only they needed,
# were dropped on 20 October 2026; an existing venv can keep them, unused.

