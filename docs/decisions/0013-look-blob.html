<style>
html,body{margin:0;width:800px;height:480px;overflow:hidden;background:#05100a;font-family:sans-serif;color:#eef2ec}

.ring{position:absolute;inset:0;background-size:100% 100%;will-change:transform}

.r1,.r2,.r3,.bars{display:none}

.r3{background-image:url(r-inner.png);animation:spin 5s linear infinite}

.bar{position:absolute;left:50%;top:50%;width:3px;height:20px;margin:-10px 0 0 -1.5px}
